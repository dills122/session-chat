[package]
name = "test-private-dir"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
getrandom = "=0.4.3"
same-file.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

# The only unsafe operations are the Windows directory creation API and its
# allocator-paired security descriptor. No production package depends on this.
[lints.rust]
unsafe_code = "deny"
