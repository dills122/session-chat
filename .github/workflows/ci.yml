name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify repository-pinned Rust toolchain
        run: |
          rustc --version --verbose
          node -e 'const { execFileSync } = require("node:child_process"); const version = execFileSync("rustc", ["--version"], { encoding: "utf8" }).trim().split(/\s+/)[1]; if (version !== "1.97.1") throw new Error("expected Rust 1.97.1, received " + version);'

      - name: Restore Rust dependency build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-workspace-crates: false

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint every target and feature
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings --no-deps

      - name: Test every feature
        run: cargo test --workspace --all-features --locked --offline

      - name: Build warning-free documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked --offline

  l2-evidence:
    name: L2 evidence (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            image: ubuntu-24.04
            timeout: 25
          - name: macOS arm64
            os: macos-15
            image: macos-15
            timeout: 25
          - name: Windows x64
            os: windows-2025
            image: windows-2025
            # A cold checked-cfg build links the sessionctl and fault-VFS
            # dependency graphs separately and exceeded 24 minutes in CI.
            timeout: 45
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      RUSTFLAGS: --cfg session_chat_storage_fault_testing
      SESSION_CHAT_L2_RUNNER_IMAGE: ${{ matrix.image }}
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Rust dependency build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-workspace-crates: false
          shared-key: l2-evidence

      - name: Verify the actual evidence compiler
        run: |
          rustc --version --verbose
          node -e 'const { execFileSync } = require("node:child_process"); const version = execFileSync("rustc", ["--version"], { encoding: "utf8" }).trim().split(/\s+/)[1]; if (version !== "1.97.1") throw new Error("expected Rust 1.97.1, received " + version);'

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Prove the pull-request smoke catches defective evidence
        if: github.event_name == 'pull_request'
        run: |
          cargo test -p sessionctl --test l2_outbox_crash_restart --locked --offline -- --nocapture --test-threads=1
          cargo test -p sessionctl --test l2_public_evidence --locked --offline
          cargo test -p sessionctl --lib l2_process::evidence::tests --locked --offline
          cargo test -p sessionctl --lib l2_process::welcome::tests --locked --offline -- --test-threads=1
          cargo test -p storage-sqlcipher-fault-vfs controller::tests::defective_persistent_gap_after_target_is_rejected --locked --offline -- --exact
          cargo test -p sessionctl --test l2_process checked::defective_frames_diagnostics_and_semantics_fail_closed --locked --offline -- --exact --test-threads=1
          cargo test -p sessionctl --test l2_io_faults checked::one_shot_full_reopens_as_one_complete_inviter_state --locked --offline -- --exact --test-threads=1
          cargo test -p sessionctl --test l2_io_faults checked::pause_child_canary_is_captured_and_rejected_before_public_evidence --locked --offline -- --exact --test-threads=1

      - name: Run complete portable L2 evidence suites
        if: github.event_name != 'pull_request'
        run: |
          cargo test -p sessionctl --test l2_outbox_crash_restart --locked --offline -- --nocapture --test-threads=1
          cargo test -p sessionctl --test l2_public_evidence --locked --offline
          cargo test -p sessionctl --lib l2_process::evidence::tests --locked --offline
          cargo test -p sessionctl --lib l2_process::welcome::tests --locked --offline -- --test-threads=1
          cargo test -p sessionctl --test l2_crash_restart_inviter --locked --offline -- --nocapture --test-threads=1
          cargo test -p sessionctl --test l2_crash_restart_joiner --locked --offline -- --nocapture --test-threads=1
          cargo test -p sessionctl --test l2_io_faults --locked --offline -- --nocapture --test-threads=1

  node:
    name: Retained Node tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install repository-pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Report runtime version
        run: node --version

      - name: Test retained Node tooling
        run: node --test scripts/check-rust-coverage.test.mjs scripts/setup-codex-links.test.mjs spikes/sealed-invitation-provider/test/provider.test.mjs

  coverage:
    name: Rust production coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install repository-pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install pinned source-coverage driver
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Enforce production coverage and ratchets
        run: node scripts/check-rust-coverage.mjs

  site:
    name: Astro project site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install repository-pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the locked site dependency graph
        run: npm ci --prefix site

      - name: Type-check Astro components
        run: npm run check --prefix site

      - name: Build the static GitHub Pages artifact
        run: npm run build --prefix site

      - name: Generate the text-only site copy
        run: npm run dump:copy --prefix site

      - name: Reject a stale text-only copy dump
        run: git diff --exit-code -- site/CONTENT_DUMP.md

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install repository-pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test and run repository policy checks
        run: |
          node --test scripts/check-repository.test.mjs
          node scripts/check-repository.mjs

  dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, unknown
          license-check: false

  gate:
    name: Gate
    if: always()
    needs:
      - rust
      - l2-evidence
      - node
      - coverage
      - site
      - repository-policy
      - dependency-policy
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every intended result
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_RESULT: ${{ needs.rust.result }}
          L2_EVIDENCE_RESULT: ${{ needs.l2-evidence.result }}
          NODE_RESULT: ${{ needs.node.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SITE_RESULT: ${{ needs.site.result }}
          REPOSITORY_POLICY_RESULT: ${{ needs.repository-policy.result }}
          DEPENDENCY_POLICY_RESULT: ${{ needs.dependency-policy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$L2_EVIDENCE_RESULT" = success
          test "$NODE_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$SITE_RESULT" = success
          test "$REPOSITORY_POLICY_RESULT" = success
          test "$DEPENDENCY_POLICY_RESULT" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
