[workspace]
members = [
  "apps/sessionctl",
  "crates/admission-capability",
  "crates/key-protector-passphrase",
  "crates/session-admission",
  "crates/session-core",
  "crates/session-crypto",
  "crates/session-crypto-hpke",
  "crates/session-crypto-mls",
  "crates/session-inviter-transaction",
  "crates/session-protocol",
  "crates/session-storage",
  "crates/session-transport",
  "crates/storage-sqlcipher",
  "crates/storage-sqlcipher-fault-vfs",
  "crates/transport-memory",
  "crates/transport-conformance",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
aws-lc-rs = { version = "=1.16.3", default-features = false, features = ["non-fips"] }
minicbor = { version = "=2.3.0", features = ["std"] }
mls-rs = { version = "=0.56.0", default-features = false, features = [
  "external_client",
  "out_of_order",
  "prior_epoch",
  "std",
  "tree_index",
] }
mls-rs-crypto-awslc = { version = "=0.25.0", default-features = false, features = ["non-fips"] }
mls-rs-crypto-hpke = "=0.21.0"
mls-rs-core = "=0.27.0"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(session_chat_storage_fault_testing)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
