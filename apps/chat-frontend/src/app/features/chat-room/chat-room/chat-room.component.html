<div class="mx-auto w-full max-w-4xl py-6">
  <nb-chat title="Current Chat Session" size="large">
    <nb-chat-message
      *ngFor="let msg of messages"
      [type]="msg.type"
      [message]="msg.text"
      [reply]="msg.reply"
      [sender]="msg.user.name"
      [date]="msg.date"
      [quote]="msg.quote"
    >
    </nb-chat-message>
    <nb-chat-form (send)="sendMessage($event)" [dropFiles]="false"> </nb-chat-form>
  </nb-chat>
</div>
