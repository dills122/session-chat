<div class="flex min-h-[calc(100vh-12rem)] items-center justify-center py-10">
  <div class="w-full max-w-3xl">
    <nb-card>
      <nb-card-header>
        <h3>Create Session</h3>
      </nb-card-header>
      <nb-card-body>
        <form>
          <div class="mx-auto grid max-w-xl gap-6 pb-4">
            <div class="grid gap-3">
              <div>
                <h6>Add Participant</h6>
              </div>
              <div class="grid grid-cols-[1fr_auto] gap-3">
                <div>
                  <nb-form-field>
                    <nb-icon nbPrefix icon="at-outline" pack="eva"></nb-icon>
                    <input
                      fullWidth
                      name="participantUid"
                      type="text"
                      placeholder="Participant Uid"
                      [(ngModel)]="participantUid"
                      nbInput
                    />
                  </nb-form-field>
                </div>
                <div>
                  <button
                    (click)="generateLink()"
                    name="link-generation"
                    [disabled]="participantUid?.length <= 0"
                    nbButton
                    nbTooltip="Generate link"
                    nbTooltipIcon="link-outline"
                    status="info"
                  >
                    <nb-icon icon="link-2-outline"></nb-icon>
                  </button>
                </div>
              </div>
              <div class="grid gap-1 pt-3" *ngIf="linkUrl$ | async as generatedLink">
                <div>
                  <nb-form-field>
                    <input #generated_link fullWidth name="participantLink" type="text" [value]="generatedLink" nbInput />
                  </nb-form-field>
                </div>
                <div class="mx-2 break-words text-xs font-bold text-amber-700">
                  Note: remember to send the other Participant their info above.
                </div>
              </div>
            </div>
            <div class="grid gap-3">
              <div>
                <h6>Create Unique ID</h6>
              </div>
              <div>
                <nb-form-field>
                  <nb-icon nbPrefix icon="at-outline" pack="eva"></nb-icon>
                  <input
                    fullWidth
                    name="ownersUid"
                    type="text"
                    placeholder="Unique Id"
                    [(ngModel)]="ownersUid"
                    nbInput
                  />
                </nb-form-field>
              </div>
            </div>
            <div>
              <button
                nbButton
                fullWidth
                status="primary"
                (click)="openConfirmationModal()"
                [disabled]="!this.canCreateSession()"
              >
                Create & Join Session
              </button>
            </div>
          </div>
        </form>
      </nb-card-body>
    </nb-card>
    <td-confirm-modal
      #session_confirmation
      title="Confirm Session Creation"
      (confirmEvent)="verifyConfirmModalResult($event)"
    >
      <p class="font-semibold text-amber-700">Are you sure you want to create the session?</p>
      <p class="text-slate-700">
        Make sure you have sent the other Participant their link and username <u>before</u> proceeding.
      </p>
    </td-confirm-modal>
  </div>
</div>
