<div class="flex min-h-[calc(100vh-12rem)] items-center justify-center py-10">
  <div class="w-full max-w-2xl">
    <nb-card>
      <nb-card-body>
        <nb-card-body>
          <form>
            <div class="mx-auto grid max-w-xl gap-4">
              <div>
                <nb-form-field>
                  <nb-icon nbPrefix icon="at-outline" pack="eva"></nb-icon>
                  <input fullWidth name="uid" type="text" [(ngModel)]="uId" nbInput />
                </nb-form-field>
              </div>
              <div>
                <button nbButton fullWidth status="primary" (click)="login()">Sign In</button>
              </div>
            </div>
          </form>
        </nb-card-body>
      </nb-card-body>
    </nb-card>
  </div>
</div>
