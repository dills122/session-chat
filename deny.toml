[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Re-reviewed at Task 10 start on 2026-09-05: paste 1.0.15 remains an unmaintained transitive Linux-only macro dependency through pinned iroh 1.1.0/netwatch, with no safe upgrade. It has no protocol or cryptographic authority. Owner: @dills122. Remove or review again by 2026-12-04." },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
  # Re-reviewed at Task 10 start on 2026-09-05. These are exact transitive
  # dependencies of pinned iroh 1.1.0 and do not permit the license for
  # unrelated crates or later versions.
  { allow = ["MPL-2.0"], crate = "attohttpc@0.30.1" },
  { allow = ["Zlib"], crate = "foldhash@0.2.0" },
  { allow = ["BSD-2-Clause"], crate = "spez@0.1.2" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
