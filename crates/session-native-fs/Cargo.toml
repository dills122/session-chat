[package]
name = "session-native-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

# Native security APIs are isolated behind this crate's safe interface.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
